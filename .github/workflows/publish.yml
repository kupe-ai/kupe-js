name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@kupe"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted Publishing (OIDC) — no NPM_TOKEN needed once configured on npmjs.com
      - run: npm publish --access public --provenance
