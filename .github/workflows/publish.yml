name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            npx --yes npm@latest publish --access public
          else
            # OIDC trusted publishing: do not use setup-node registry-url or NODE_AUTH_TOKEN.
            rm -f "$HOME/.npmrc" .npmrc
            npx --yes npm@latest publish --access public --provenance
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
